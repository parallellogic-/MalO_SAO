<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Page</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            text-align: center;
        }

        /* Profile Section */
        .profile {
            margin-bottom: 2.5rem;
        }

        .profile img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
        }

        .profile h1 {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .profile p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
        }

        /* Links Section */
        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem; /* Space between rectangular links */
        }

        .link-btn {
            display: block;
            background-color: white;
            padding: 1.2rem;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 1.05rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
            transition: all 0.2s ease;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile -->
        <div class="profile">
            <img src="https://placeholder.com" alt="Profile Picture">
            <h1>Jane Doe</h1>
            <p>Digital Creator & Developer</p>
        </div>

        <!-- Rectangular Links -->
        <div class="links">
            <a href="https://example.com" class="link-btn">Visit My Portfolio</a>
            <a href="https://example.com" class="link-btn">Read My Latest Blog</a>
            <a href="https://example.com" class="link-btn">Follow on Twitter</a>
            <a href="https://example.com" class="link-btn">Contact Me</a>
        </div>
    </div>

</body>
</html>
